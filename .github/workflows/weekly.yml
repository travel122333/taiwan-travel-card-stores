name: weekly-update

on:
  schedule:
    - cron: "0 18 * * 6"   # 週六 18:00 UTC = 台灣週日 02:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 測試能否連到 NCCC
        run: |
          if ! curl -sS -o /dev/null --max-time 60 --retry 2 "https://travel.nccc.com.tw/NASApp/NTC/servlet/com.du.mvc.EntryServlet?Action=RetailerInquiry&Type=GetFull"; then
            echo "GitHub Actions 無法連線 NCCC（travel.nccc.com.tw）"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 保留舊 CSV 供比對
        run: |
          mkdir -p data/prev
          if [ -f data/stores_active.csv ]; then mv data/stores_active.csv data/prev/stores_active.csv; fi
      - run: python crawl.py 0
      - run: python build_data.py
      - name: 有變動才 commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "沒有變動"
          else
            git commit -m "資料更新 $(date -u +%F)"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
